<!DOCTYPE html>

    <section class="hero-section">

                </div>

                <div class="logo">
                    <img src="assets/images/logo-white.svg" alt="">

            </div>

            <div class="nav-center">
                <ul class="nav-menu">
                    <li><a href="#">Home <i class="bi bi-chevron-down"></i></a></li>
                    <li><a href="#">Listings <i class="bi bi-chevron-down"></i></a></li>
